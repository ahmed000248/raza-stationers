services:
  - type: web
    name: raza-stationers-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render sets PORT automatically — our Dockerfile defaults to 4000
    # but the runtime env var takes precedence.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: raza-stationers-api
          property: port
      - key: JWT_SECRET
        sync: false          # injected manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # injected manually in Render dashboard
      - key: DIRECT_URL
        sync: false          # injected manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # injected manually: comma-separated Vercel URLs
    healthCheckPath: /
