version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=staging_jwt_secret_token_minimum_32_chars_long
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      # Note: DATABASE_URL and DIRECT_URL should be passed from host env or env file
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
