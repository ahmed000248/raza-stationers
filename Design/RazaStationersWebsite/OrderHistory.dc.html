<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/tokens/colors.css">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/tokens/typography.css">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/tokens/radius.css">
  <link rel="stylesheet" href="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/styles.css">
  <script src="_ds/raza-stationers-design-system-64cfb0c8-36fc-4513-aa90-41c574631621/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--canvas);font-family:var(--font-body);}
    a{color:var(--evergreen-600);}
    a:hover{color:var(--forest-700);}
    @keyframes razaFadeRise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    @keyframes razaToastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
    .raza-cta:active{transform:scale(0.97);}
    .raza-order-card:hover{border-color:var(--sage-400);}
  </style>
</helmet>
<dc-import name="SiteNav" active="history" hint-size="100%,64px"></dc-import>
<div style="padding-top:96px;max-width:820px;margin:0 auto;padding-left:24px;padding-right:24px;padding-bottom:80px;">
  <h1 style="font-family:var(--font-display);font-size:26px;color:var(--ink-900);margin:0 0 24px;">Order History</h1>

  <sc-if value="{{ hasOrders }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:14px;">
      <sc-for list="{{ orders }}" as="o" hint-placeholder-count="4">
        <div class="raza-order-card" style="{{ o.cardStyle }}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div>
              <div style="font-size:14px;font-weight:700;color:var(--ink-900);">{{ o.id }}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">{{ o.date }} · {{ o.items }} items</div>
            </div>
            <div style="{{ o.badgeStyle }}">{{ o.statusLabel }}</div>
          </div>
          <div style="font-size:17px;font-weight:700;color:var(--ink-900);margin-top:12px;">{{ o.totalText }}</div>
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
            <a href="OrderTracking.dc.html" style="{{ o.actionBtnStyle }}">Track</a>
            <button onClick="{{ o.onReorder }}" style="{{ o.actionBtnStyleBtn }}">Reorder</button>
            <button onClick="{{ o.onInvoice }}" style="{{ o.actionBtnStyleBtn }}">Invoice</button>
            <sc-if value="{{ o.canChange }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ o.onChangeRequest }}" style="{{ o.changeBtnStyle }}">Request Change / Cancel</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="text-align:center;padding:80px 20px;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--mist-100);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
        <x-import component-from-global-scope="RazaStationersDesignSystem_64cfb0.Icon" name="invoice" size="26" color="var(--evergreen-600)" hint-size="26px,26px"></x-import>
      </div>
      <div style="font-size:17px;font-weight:600;color:var(--ink-900);">No orders yet</div>
      <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">Your placed orders will show up here.</div>
      <a href="Catalogue.dc.html" class="raza-cta" style="height:46px;padding:0 30px;border-radius:999px;background:var(--evergreen-600);color:#fff;display:inline-flex;align-items:center;font-size:14px;font-weight:600;text-decoration:none;margin-top:22px;">Browse Catalogue</a>
    </div>
  </sc-if>
</div>

<sc-if value="{{ toastVisible }}" hint-placeholder-val="{{ false }}">
  <div style="{{ toastStyle }}">{{ toastMessage }}</div>
</sc-if>
<dc-import name="SiteFooter" hint-size="100%,300px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { toast: null };
  componentDidMount() { import('./shared/store.js').then((mod) => { this._store = mod; this.forceUpdate(); }); }
  componentWillUnmount() { clearTimeout(this._toastT); }

  showToast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => this.setState({ toast: null }), 2600);
  }

  renderVals() {
    const store = this._store;
    if (!store) return { hasOrders: false, isEmpty: true, orders: [], toastVisible: false };
    const toneColors = { success: { bg: 'var(--mist-100)', c: 'var(--evergreen-600)' }, warning: { bg: 'var(--amber-tint)', c: 'var(--amber-ink)' }, error: { bg: 'var(--red-tint)', c: 'var(--red-ink)' }, info: { bg: 'var(--blue-tint)', c: 'var(--blue-ink)' } };
    const btnStyle = { height: 38, padding: '0 16px', borderRadius: 999, border: '1px solid var(--border-subtle)', background: 'none', color: 'var(--ink-900)', fontSize: 12, fontWeight: 600, cursor: 'pointer', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', fontFamily: 'var(--font-body)' };
    const orders = store.ORDERS.map((o) => {
      const meta = store.STATUS_META[o.status];
      const tc = toneColors[meta.tone] || toneColors.info;
      return {
        id: o.id, date: o.date, items: o.items,
        totalText: store.formatPrice(o.total),
        statusLabel: meta.label,
        badgeStyle: { fontSize: 11, fontWeight: 600, color: tc.c, background: tc.bg, padding: '5px 12px', borderRadius: 999, whiteSpace: 'nowrap' },
        cardStyle: { background: '#fff', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 20, transition: 'border-color 150ms ease-out', animation: 'razaFadeRise 350ms ease-out both' },
        actionBtnStyle: btnStyle,
        actionBtnStyleBtn: btnStyle,
        onReorder: () => this.showToast(`Items from ${o.id} added to cart`),
        onInvoice: () => { window.open(`Invoice.dc.html?id=${o.id}`, '_blank'); },
        canChange: o.canChange,
        changeBtnStyle: { ...btnStyle, border: '1px solid var(--amber-500)', color: 'var(--amber-ink)' },
        onChangeRequest: () => this.showToast(`Change request submitted for ${o.id}`),
      };
    });
    return {
      hasOrders: orders.length > 0, isEmpty: orders.length === 0,
      orders,
      toastVisible: !!this.state.toast,
      toastMessage: this.state.toast || '',
      toastStyle: { position: 'fixed', bottom: 90, left: '50%', transform: 'translateX(-50%)', background: 'var(--ink-900)', color: '#fff', padding: '14px 24px', borderRadius: 999, fontSize: 13, fontWeight: 500, zIndex: 100, animation: 'razaToastIn 250ms ease-out both', boxShadow: '0 8px 24px rgba(5,31,32,0.25)' },
    };
  }
}

</script>
</body>
</html>
